<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Magic Tap</title>
<style>
    body {
        margin: 0;
        height: 100vh;
        overflow: hidden;
        background: black;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        font-family: Arial;
    }

    h1 {
        position: absolute;
        top: 20px;
        font-size: 18px;
        opacity: 0.7;
    }

    .star {
        position: absolute;
        width: 8px;
        height: 8px;
        background: radial-gradient(circle, #fff, #0ff, transparent);
        border-radius: 50%;
        pointer-events: none;
        animation: fade 1s ease-out forwards;
    }

    @keyframes fade {
        from { transform: scale(1); opacity: 1; }
        to { transform: scale(4); opacity: 0; }
    }
</style>
</head>
<body>

<h1>Tap anywhere ✨</h1>

<script>
document.addEventListener("click", function(e) {
    const star = document.createElement("div");
    star.className = "star";
    star.style.left = e.clientX + "px";
    star.style.top = e.clientY + "px";
    document.body.appendChild(star);

    setTimeout(() => star.remove(), 1000);
});
</script>

</body>
</html>

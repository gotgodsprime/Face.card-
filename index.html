<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SEFA AI — Premium Voice Assistant</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              black: '#05070c',
              dark: '#0b0f19',
              purple: '#7c3aed',
              pink: '#ff3366',
              cyan: '#06b6d4',
              glass: 'rgba(15, 23, 42, 0.45)',
              border: 'rgba(255, 255, 255, 0.08)'
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'Inter', 'SF Pro Display', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SEFA AI">
  <meta name="theme-color" content="#05070c">

  <style>
    /* Premium custom scrollbar */
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
    }

    /* Glassmorphism utility */
    .glassmorphic {
      background: rgba(13, 18, 30, 0.65);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.07);
    }
    .glassmorphic-card {
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* Ambient Pulsing Aura */
    .glowing-aura {
      background: radial-gradient(circle at 50% 50%, rgba(124, 58, 237, 0.18) 0%, rgba(255, 51, 102, 0.08) 50%, transparent 100%);
      filter: blur(60px);
      pointer-events: none;
    }

    /* Dynamic pulsing animation for custom audio button */
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.1); opacity: 0.4; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .pulse-glow {
      animation: pulse-ring 3s infinite ease-in-out;
    }

    /* Bounce wave animation for dynamic island */
    @keyframes wave-bounce {
      0%, 100% { transform: scaleY(0.3); }
      50% { transform: scaleY(1.1); }
    }
    .wave-bar {
      animation: wave-bounce 1s ease-in-out infinite;
    }

    /* Chat item transition states */
    .msg-transition {
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
  </style>
</head>
<body class="bg-brand-black text-slate-100 font-sans h-full overflow-hidden select-none flex justify-center items-center">

  <div class="absolute inset-0 z-0 overflow-hidden">
    <div id="glow-1" class="absolute top-1/4 left-1/4 w-[400px] h-[400px] glowing-aura transition-all duration-[8000ms] ease-in-out transform -translate-x-1/2 -translate-y-1/2"></div>
    <div id="glow-2" class="absolute bottom-1/4 right-1/4 w-[500px] h-[500px] glowing-aura transition-all duration-[10000ms] ease-in-out transform translate-x-1/2 translate-y-1/2" style="background: radial-gradient(circle, rgba(6, 182, 212, 0.15) 0%, rgba(124, 58, 237, 0.05) 50%, transparent 100%);"></div>
  </div>

  <main class="relative z-10 w-full h-full max-w-md bg-brand-black/90 md:rounded-[48px] md:shadow-[0_24px_80px_rgba(0,0,0,0.8)] md:border md:border-white/10 flex flex-col overflow-hidden transition-all duration-300">
    
    <header class="flex-none px-6 pt-3 pb-2 flex justify-between items-center z-50">
      <span id="statusBarTime" class="text-xs font-bold tracking-tight text-white/90">9:41</span>
      
      <div id="dynamicIsland" class="glassmorphic rounded-full px-4 py-1.5 flex items-center gap-2.5 shadow-lg border border-white/10 transition-all duration-500 scale-100 hover:scale-105 active:scale-95 cursor-pointer max-w-[180px]">
        <div class="relative w-3.5 h-3.5 flex items-center justify-center">
          <span class="absolute inline-flex h-2 w-2 rounded-full bg-brand-pink animate-ping"></span>
          <span id="islandDot" class="relative inline-flex rounded-full h-2 w-2 bg-brand-pink transition-colors duration-300"></span>
        </div>
        <span id="islandStatus" class="text-[10px] uppercase tracking-wider font-extrabold text-brand-pink transition-all duration-300">SEFA ONLINE</span>
      </div>

      <div class="flex items-center gap-1.5 text-white/90">
        <i class="fa-solid fa-signal text-[10px]"></i>
        <i class="fa-solid fa-wifi text-[10px]"></i>
        <div class="relative w-5 h-2.5 border border-white/40 rounded-[4px] p-[1px] flex items-center">
          <div class="bg-white h-full w-4/5 rounded-[2px]"></div>
          <div class="absolute -right-[3px] top-[3px] bg-white/40 w-[2px] h-[3px] rounded-r-[1px]"></div>
        </div>
      </div>
    </header>

    <section class="px-6 py-3 flex items-center justify-between border-b border-brand-border z-20">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-purple to-brand-pink flex items-center justify-center shadow-lg shadow-brand-purple/20">
          <i class="fa-solid fa-microchip text-white text-sm"></i>
        </div>
        <div>
          <h1 class="text-base font-extrabold tracking-tight text-white flex items-center gap-1.5">
            SEFA AI
            <span class="text-[9px] bg-gradient-to-r from-brand-pink to-brand-purple text-white px-1.5 py-0.5 rounded-full uppercase tracking-wider font-extrabold">2.5 PRO</span>
          </h1>
          <p id="assistantStatusSubtitle" class="text-[10px] text-slate-400 font-medium">Ready to chat & listen</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button id="btnVoiceSettings" class="w-9 h-9 rounded-xl glassmorphic-card flex items-center justify-center text-slate-300 hover:text-white hover:bg-white/5 active:scale-95 transition-all" title="Voice Configuration">
          <i class="fa-solid fa-sliders text-sm"></i>
        </button>
        <button id="btnClearMemory" class="w-9 h-9 rounded-xl glassmorphic-card flex items-center justify-center text-slate-300 hover:text-white hover:bg-white/5 active:scale-95 transition-all" title="Reset Session">
          <i class="fa-solid fa-trash-can text-sm"></i>
        </button>
      </div>
    </section>

    <section id="panelVoiceSettings" class="hidden px-6 py-4 border-b border-brand-border bg-slate-900/90 backdrop-blur-xl transition-all duration-300 z-40">
      <div class="flex justify-between items-center mb-3">
        <h3 class="text-xs font-extrabold uppercase tracking-widest text-slate-300 flex items-center gap-1.5">
          <i class="fa-solid fa-volume-high text-brand-purple"></i> Speech Preferences
        </h3>
        <button id="btnCloseSettings" class="text-xs text-slate-400 hover:text-white font-bold">Done</button>
      </div>
      <div class="grid grid-cols-1 gap-3">
        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="block text-[10px] text-slate-400 font-bold uppercase">Voice Character</label>
            <button id="btnTestVoice" class="text-[10px] text-brand-pink font-extrabold hover:underline">Test Speech Engine</button>
          </div>
          <select id="selectVoice" class="w-full bg-slate-950 border border-brand-border rounded-lg text-xs py-2 px-2.5 text-slate-200 outline-none focus:border-brand-purple transition-all">
            <option value="">Searching for system voices...</option>
          </select>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-[10px] text-slate-400 font-bold mb-1 uppercase">Speed (Rate)</label>
            <input id="sliderRate" type="range" min="0.5" max="2" step="0.1" value="1.0" class="w-full accent-brand-purple bg-slate-950 rounded-lg">
          </div>
          <div>
            <label class="block text-[10px] text-slate-400 font-bold mb-1 uppercase">Pitch</label>
            <input id="sliderPitch" type="range" min="0.5" max="1.5" step="0.1" value="1.0" class="w-full accent-brand-pink bg-slate-950 rounded-lg">
          </div>
        </div>
      </div>
    </section>

    <section id="chatContainer" class="flex-1 overflow-y-auto px-6 py-4 flex flex-col gap-4 relative z-10">
      
      <div id="welcomeScreen" class="my-auto flex flex-col items-center justify-center text-center py-6">
        <div class="relative mb-6">
          <div class="absolute inset-0 bg-gradient-to-tr from-brand-purple to-brand-pink rounded-full blur-2xl opacity-40 scale-125"></div>
          <div class="relative w-20 h-20 rounded-full bg-gradient-to-tr from-brand-purple via-brand-dark to-brand-pink p-[1px]">
            <div class="w-full h-full rounded-full bg-brand-black flex items-center justify-center">
              <i class="fa-solid fa-brain text-2xl text-transparent bg-clip-text bg-gradient-to-tr from-brand-purple to-brand-pink animate-pulse"></i>
            </div>
          </div>
        </div>
        <h2 class="text-xl font-black text-white tracking-tight mb-2">Hey, I'm SEFA</h2>
        <p class="text-xs text-slate-400 max-w-xs leading-relaxed mb-6">
          Your premium voice companion. Tap below to start listening or use quick triggers!
        </p>

        <div class="grid grid-cols-2 gap-2.5 w-full">
          <button id="chipTime" class="glassmorphic-card text-left p-3 rounded-xl hover:bg-white/5 active:scale-95 transition-all text-[11px] font-semibold text-slate-300">
            <span class="text-brand-purple block mb-1 font-bold"><i class="fa-regular fa-clock mr-1"></i> Time Check</span>
            "What time is it right now?"
          </button>
          <button id="chipAbout" class="glassmorphic-card text-left p-3 rounded-xl hover:bg-white/5 active:scale-95 transition-all text-[11px] font-semibold text-slate-300">
            <span class="text-brand-pink block mb-1 font-bold"><i class="fa-solid fa-wand-magic-sparkles mr-1"></i> About SEFA</span>
            "Who are you & what can you do?"
          </button>
          <button id="chipQuote" class="glassmorphic-card text-left p-3 rounded-xl hover:bg-white/5 active:scale-95 transition-all text-[11px] font-semibold text-slate-300">
            <span class="text-brand-cyan block mb-1 font-bold"><i class="fa-regular fa-star mr-1"></i> Inspiration</span>
            "Give me a playful quote"
          </button>
          <button id="chipAttendance" class="glassmorphic-card text-left p-3 rounded-xl hover:bg-white/5 active:scale-95 transition-all text-[11px] font-semibold text-slate-300">
            <span class="text-emerald-400 block mb-1 font-bold"><i class="fa-regular fa-calendar-check mr-1"></i> Commands</span>
            "Open my attendance app"
          </button>
        </div>
      </div>

      <div id="messagesList" class="flex flex-col gap-4"></div>

      <div id="liveTranscriptOverlay" class="hidden glassmorphic rounded-2xl p-4 border border-brand-purple/20 shadow-xl shadow-brand-purple/5 mt-auto animate-pulse flex flex-col gap-1.5 msg-transition">
        <span class="text-[9px] uppercase tracking-wider font-extrabold text-brand-purple flex items-center gap-1">
          <i class="fa-solid fa-microphone"></i> Hearing Live speech...
        </span>
        <p id="liveTranscriptText" class="text-sm text-slate-100 font-medium leading-relaxed italic">...</p>
      </div>

      <div id="typingIndicator" class="hidden flex items-center gap-2.5 self-start glassmorphic px-4 py-3 rounded-2xl border border-white/5 shadow-md">
        <span class="text-xs text-slate-400 font-medium">SEFA is formulating response</span>
        <div class="flex items-center gap-1">
          <span class="w-1.5 h-1.5 rounded-full bg-brand-purple animate-bounce" style="animation-delay: 0ms"></span>
          <span class="w-1.5 h-1.5 rounded-full bg-brand-pink animate-bounce" style="animation-delay: 150ms"></span>
          <span class="w-1.5 h-1.5 rounded-full bg-brand-purple animate-bounce" style="animation-delay: 300ms"></span>
        </div>
      </div>
    </section>

    <section class="flex-none p-6 border-t border-brand-border bg-brand-dark/85 backdrop-blur-md relative z-20 flex flex-col gap-4">
      
      <div class="relative w-full h-12 flex items-center justify-center overflow-hidden rounded-xl bg-slate-950/40 border border-white/5">
        <canvas id="waveformCanvas" class="absolute inset-0 w-full h-full"></canvas>
        <span id="waveStatusLabel" class="relative z-10 text-[9px] uppercase tracking-widest font-extrabold text-slate-500 pointer-events-none transition-all duration-300">IDLE</span>
      </div>

      <div class="flex items-center gap-3">
        <button id="btnWakePhrase" class="flex-none px-3.5 h-12 rounded-xl glassmorphic-card hover:bg-white/5 active:scale-95 transition-all flex items-center justify-center gap-2 text-xs font-bold text-slate-300" title='Say "Hey SEFA"'>
          <i class="fa-solid fa-bolt text-brand-purple animate-pulse"></i>
          <span>Hey SEFA</span>
        </button>

        <div class="flex-1 relative flex items-center">
          <input id="manualInput" type="text" placeholder="Or ask me anything..." class="w-full bg-slate-950/60 border border-brand-border focus:border-brand-purple/50 rounded-xl py-3 pl-4 pr-11 text-xs text-white placeholder-slate-500 outline-none transition-all">
          <button id="btnSendText" class="absolute right-2 w-8 h-8 rounded-lg bg-brand-purple/20 text-brand-purple hover:bg-brand-purple hover:text-white flex items-center justify-center transition-all duration-300">
            <i class="fa-solid fa-arrow-up text-xs"></i>
          </button>
        </div>
      </div>

      <div class="flex flex-col items-center justify-center mt-2">
        <div class="relative">
          <div id="micRing1" class="absolute -inset-4 bg-brand-purple/25 rounded-full blur-xl scale-95 opacity-0 transition-all duration-500"></div>
          <div id="micRing2" class="absolute -inset-1.5 rounded-full border border-brand-pink/40 animate-ping opacity-0 transition-all duration-500"></div>
          
          <button id="btnMicTrigger" class="relative w-20 h-20 rounded-full bg-gradient-to-tr from-brand-purple via-brand-dark to-brand-pink p-[2px] shadow-[0_8px_32px_rgba(124,58,237,0.3)] hover:scale-105 active:scale-95 transition-all duration-300 focus:outline-none">
            <div class="w-full h-full rounded-full bg-brand-black flex flex-col items-center justify-center text-white transition-all duration-300 hover:bg-brand-black/90">
              <i id="micIcon" class="fa-solid fa-microphone text-xl text-white"></i>
              <span id="micLabel" class="text-[8px] uppercase tracking-widest font-black text-brand-pink mt-1 animate-pulse">TAP TO TALK</span>
            </div>
          </button>
        </div>
        <p id="micHint" class="text-[9px] text-slate-500 font-bold uppercase tracking-wider mt-3.5">Tap to initiate real-time AI hearing</p>
      </div>
    </section>
  </main>

  <script>
    const apiKey = ""; 
    const systemPrompt = "You are SEFA AI, a premium personal assistant. Keep responses short, concise, engaging, and highly conversational (1-2 sentences max) so they are easy to read aloud. Address the user directly. Never write markdown. Speak casually, confidently, and naturally.";

    const state = {
      isListening: false,
      isThinking: false,
      isSpeaking: false,
      isAudioEngineUnlocked: false,
      history: JSON.parse(localStorage.getItem('sefa_chat_history')) || [],
      voiceConfig: {
        voiceIndex: parseInt(localStorage.getItem('sefa_voice_idx')) || 0,
        rate: parseFloat(localStorage.getItem('sefa_voice_rate')) || 1.0,
        pitch: parseFloat(localStorage.getItem('sefa_voice_pitch')) || 1.0
      }
    };

    // DOM Cache
    const statusBarTime = document.getElementById('statusBarTime');
    const islandDot = document.getElementById('islandDot');
    const islandStatus = document.getElementById('islandStatus');
    const assistantStatusSubtitle = document.getElementById('assistantStatusSubtitle');
    const btnVoiceSettings = document.getElementById('btnVoiceSettings');
    const btnClearMemory = document.getElementById('btnClearMemory');
    const panelVoiceSettings = document.getElementById('panelVoiceSettings');
    const btnCloseSettings = document.getElementById('btnCloseSettings');
    const btnTestVoice = document.getElementById('btnTestVoice');
    const selectVoice = document.getElementById('selectVoice');
    const sliderRate = document.getElementById('sliderRate');
    const sliderPitch = document.getElementById('sliderPitch');
    const chatContainer = document.getElementById('chatContainer');
    const welcomeScreen = document.getElementById('welcomeScreen');
    const messagesList = document.getElementById('messagesList');
    const liveTranscriptOverlay = document.getElementById('liveTranscriptOverlay');
    const liveTranscriptText = document.getElementById('liveTranscriptText');
    const typingIndicator = document.getElementById('typingIndicator');
    const waveformCanvas = document.getElementById('waveformCanvas');
    const waveStatusLabel = document.getElementById('waveStatusLabel');
    const btnWakePhrase = document.getElementById('btnWakePhrase');
    const manualInput = document.getElementById('manualInput');
    const btnSendText = document.getElementById('btnSendText');
    const btnMicTrigger = document.getElementById('btnMicTrigger');
    const micIcon = document.getElementById('micIcon');
    const micLabel = document.getElementById('micLabel');
    const micRing1 = document.getElementById('micRing1');
    const micRing2 = document.getElementById('micRing2');
    const micHint = document.getElementById('micHint');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const synth = window.speechSynthesis;
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playChime(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      osc.connect(gainNode);
      gainNode.connect(audioCtx.destination);

      if (type === 'start') {
        osc.frequency.setValueAtTime(880, now);
        gainNode.gain.setValueAtTime(0, now);
        gainNode.gain.linearRampToValueAtTime(0.1, now + 0.05);
        gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        osc.start(now); osc.stop(now + 0.3);
      } else if (type === 'stop') {
        osc.frequency.setValueAtTime(659, now);
        osc.frequency.exponentialRampToValueAtTime(440, now + 0.2);
        gainNode.gain.setValueAtTime(0, now);
        gainNode.gain.linearRampToValueAtTime(0.08, now + 0.05);
        gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        osc.start(now); osc.stop(now + 0.3);
      } else {
        osc.frequency.setValueAtTime(500, now);
        gainNode.gain.setValueAtTime(0, now);
        gainNode.gain.linearRampToValueAtTime(0.05, now + 0.02);
        gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
        osc.start(now); osc.stop(now + 0.15);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      updateTime();
      setInterval(updateTime, 1000);
      setupVoiceOptions();
      if (synth && synth.onvoiceschanged !== undefined) {
        synth.onvoiceschanged = setupVoiceOptions;
      }
      initCanvasWave();
      renderChatHistory();
      setSystemState('idle');

      // Setup Welcome Chip Interactions
      document.getElementById('chipTime').addEventListener('click', () => usePrompt("What time is it?"));
      document.getElementById('chipAbout').addEventListener('click', () => usePrompt("Who are you and what makes you special?"));
      document.getElementById('chipQuote').addEventListener('click', () => usePrompt("Give me a playful, motivational quote"));
      document.getElementById('chipAttendance').addEventListener('click', () => usePrompt("Simulate checking my attendance"));
    });

    document.addEventListener('click', () => {
      if (!state.isAudioEngineUnlocked) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        if (synth) {
          const silentUtterance = new SpeechSynthesisUtterance('');
          synth.speak(silentUtterance);
        }
        state.isAudioEngineUnlocked = true;
      }
    });

    function updateTime() {
      const now = new Date();
      statusBarTime.textContent = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    }

    function setSystemState(mode) {
      if (mode === 'listening') {
        state.isListening = true; state.isThinking = false; state.isSpeaking = false;
        islandDot.className = "relative inline-flex rounded-full h-2 w-2 bg-brand-purple animate-ping";
        islandStatus.textContent = "LISTENING";
        islandStatus.className = "text-[10px] uppercase tracking-wider font-extrabold text-brand-purple";
        assistantStatusSubtitle.textContent = "I'm listening to you...";
        waveStatusLabel.textContent = "HEARING LIVE AUDIO";
        waveStatusLabel.className = "relative z-10 text-[9px] uppercase tracking-widest font-extrabold text-brand-purple pointer-events-none";
        micRing1.className = "absolute -inset-4 bg-brand-purple/40 rounded-full blur-xl scale-110 opacity-100 pulse-glow";
        micRing2.className = "absolute -inset-1.5 rounded-full border border-brand-purple/60 animate-ping opacity-100";
        micIcon.className = "fa-solid fa-waveform text-xl text-brand-purple animate-pulse";
        micLabel.textContent = "LISTENING";
        micLabel.className = "text-[8px] uppercase tracking-widest font-black text-brand-purple mt-1";
        micHint.textContent = "Speak clearly. Tap again to finalize command.";
      } else if (mode === 'thinking') {
        state.isListening = false; state.isThinking = true; state.isSpeaking = false;
        islandDot.className = "relative inline-flex rounded-full h-2 w-2 bg-brand-cyan animate-pulse";
        islandStatus.textContent = "THINKING";
        islandStatus.className = "text-[10px] uppercase tracking-wider font-extrabold text-brand-cyan";
        assistantStatusSubtitle.textContent = "SEFA is reasoning...";
        waveStatusLabel.textContent = "AI DECODING INTENT";
        waveStatusLabel.className = "relative z-10 text-[9px] uppercase tracking-widest font-extrabold text-brand-cyan pointer-events-none";
        typingIndicator.classList.remove('hidden');
        micRing1.className = "absolute -inset-4 bg-brand-cyan/20 rounded-full blur-xl scale-100 opacity-60";
        micRing2.className = "absolute -inset-1.5 rounded-full border border-brand-cyan/20 opacity-0";
        micIcon.className = "fa-solid fa-spinner text-xl text-brand-cyan animate-spin";
        micLabel.textContent = "THINKING";
        micLabel.className = "text-[8px] uppercase tracking-widest font-black text-brand-cyan mt-1";
      } else if (mode === 'speaking') {
        state.isListening = false; state.isThinking = false; state.isSpeaking = true;
        islandDot.className = "relative inline-flex rounded-full h-2 w-2 bg-brand-pink";
        islandStatus.textContent = "SPEAKING";
        islandStatus.className = "text-[10px] uppercase tracking-wider font-extrabold text-brand-pink";
        assistantStatusSubtitle.textContent = "Responding with voice output...";
        waveStatusLabel.textContent = "SEFA RESPONDING";
        waveStatusLabel.className = "relative z-10 text-[9px] uppercase tracking-widest font-extrabold text-brand-pink pointer-events-none";
        typingIndicator.classList.add('hidden');
        micRing1.className = "absolute -inset-4 bg-brand-pink/30 rounded-full blur-xl scale-105 opacity-80 pulse-glow";
        micRing2.className = "absolute -inset-1.5 rounded-full border border-brand-pink/30 opacity-0";
        micIcon.className = "fa-solid fa-volume-high text-xl text-brand-pink animate-bounce";
        micLabel.textContent = "SPEAKING";
        micLabel.className = "text-[8px] uppercase tracking-widest font-black text-brand-pink mt-1";
      } else {
        state.isListening = false; state.isThinking = false; state.isSpeaking = false;
        islandDot.className = "relative inline-flex rounded-full h-2 w-2 bg-brand-pink";
        islandStatus.textContent = "SEFA ONLINE";
        islandStatus.className = "text-[10px] uppercase tracking-wider font-extrabold text-brand-pink";
        assistantStatusSubtitle.textContent = "Ready to chat & listen";
        waveStatusLabel.textContent = "IDLE";
        waveStatusLabel.className = "relative z-10 text-[9px] uppercase tracking-widest font-extrabold text-slate-500 pointer-events-none";
        typingIndicator.classList.add('hidden');
        liveTranscriptOverlay.classList.add('hidden');
        micRing1.className = "absolute -inset-4 bg-brand-purple/25 rounded-full blur-xl scale-95 opacity-0";
        micRing2.className = "absolute -inset-1.5 rounded-full border border-brand-pink/40 animate-ping opacity-0";
        micIcon.className = "fa-solid fa-microphone text-xl text-white";
        micLabel.textContent = "TAP TO TALK";
        micLabel.className = "text-[8px] uppercase tracking-widest font-black text-brand-pink mt-1 animate-pulse";
        micHint.textContent = "Tap to initiate real-time AI hearing";
      }
    }

    function setupVoiceOptions() {
      if (!synth) return;
      const voices = synth.getVoices();
      selectVoice.innerHTML = '';
      if (voices.length === 0) {
        const option = document.createElement('option');
        option.textContent = "Default System Voice";
        option.value = "-1";
        selectVoice.appendChild(option);
        return;
      }
      voices.forEach((voice, i) => {
        const option = document.createElement('option');
        option.value = i;
        option.textContent = `${voice.name} (${voice.lang})`;
        if (i === state.voiceConfig.voiceIndex) option.selected = true;
        selectVoice.appendChild(option);
      });
    }

    selectVoice.addEventListener('change', () => {
      state.voiceConfig.voiceIndex = parseInt(selectVoice.value);
      localStorage.setItem('sefa_voice_idx', state.voiceConfig.voiceIndex);
    });
    sliderRate.addEventListener('input', () => {
      state.voiceConfig.rate = parseFloat(sliderRate.value);
      localStorage.setItem('sefa_voice_rate', state.voiceConfig.rate);
    });
    sliderPitch.addEventListener('input', () => {
      state.voiceConfig.pitch = parseFloat(sliderPitch.value);
      localStorage.setItem('sefa_voice_pitch', state.voiceConfig.pitch);
    });

    btnTestVoice.addEventListener('click', () => {
      speakText("Testing SEFA Speech engine. Audio is fully operational!");
    });

    btnVoiceSettings.addEventListener('click', () => panelVoiceSettings.classList.toggle('hidden'));
    btnCloseSettings.addEventListener('click', () => panelVoiceSettings.classList.add('hidden'));

    btnClearMemory.addEventListener('click', () => {
      if (confirm('Clear current conversational memory thread?')) {
        state.history = [];
        localStorage.removeItem('sefa_chat_history');
        if (synth && synth.speaking) synth.cancel();
        renderChatHistory();
        playChime('stop');
      }
    });

    function initCanvasWave() {
      const canvas = waveformCanvas;
      const ctx = canvas.getContext('2d');
      function resize() {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = canvas.parentElement.clientWidth * dpr;
        canvas.height = canvas.parentElement.clientHeight * dpr;
        ctx.scale(dpr, dpr);
      }
      window.addEventListener('resize', resize);
      resize();

      let phase = 0;
      function draw() {
        const w = canvas.width / (window.devicePixelRatio || 1);
        const h = canvas.height / (window.devicePixelRatio || 1);
        ctx.clearRect(0, 0, w, h);

        let linesCount = 3, amplitude = 4, frequency = 0.04, speed = 0.08;
        let strokeStyles = ['rgba(124, 58, 237, 0.45)', 'rgba(255, 51, 102, 0.45)', 'rgba(6, 182, 212, 0.45)'];

        if (state.isListening) {
          amplitude = 16; frequency = 0.06; speed = 0.22; linesCount = 4;
          strokeStyles = ['rgba(124, 58, 237, 0.8)', 'rgba(255, 51, 102, 0.7)', 'rgba(124, 58, 237, 0.5)', 'rgba(255, 255, 255, 0.25)'];
        } else if (state.isThinking) {
          amplitude = 8; frequency = 0.09; speed = 0.12;
          strokeStyles = ['rgba(6, 182, 212, 0.8)', 'rgba(124, 58, 237, 0.6)', 'rgba(255, 51, 102, 0.3)'];
        } else if (state.isSpeaking) {
          amplitude = 12 + Math.sin(Date.now() / 100) * 8; frequency = 0.04; speed = 0.18;
          strokeStyles = ['rgba(255, 51, 102, 0.85)', 'rgba(124, 58, 237, 0.6)', 'rgba(255, 255, 255, 0.3)'];
        } else {
          amplitude = 1.5; frequency = 0.02; speed = 0.03; linesCount = 1;
          strokeStyles = ['rgba(255, 255, 255, 0.08)'];
        }

        phase += speed;
        for (let i = 0; i < linesCount; i++) {
          ctx.beginPath();
          ctx.lineWidth = i === 0 ? 2 : 1;
          ctx.strokeStyle = strokeStyles[i % strokeStyles.length];
          const lineOffset = i * 20;
          for (let x = 0; x < w; x++) {
            const envelope = Math.sin((x / w) * Math.PI);
            const y = (h / 2) + Math.sin(x * frequency + phase + lineOffset) * amplitude * envelope;
            if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
          }
          ctx.stroke();
        }
        requestAnimationFrame(draw);
      }
      draw();
    }

    function parseSmartCommands(text) {
      const lower = text.toLowerCase().trim();
      if (lower.includes("what time is it") || lower.includes("current time")) {
        return `It is currently ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}.`;
      }
      if (lower.includes("attendance")) {
        return "Opening your attendance portal. Stand by... Checked! Current records show an optimal 96% track score.";
      }
      return null;
    }

    function usePrompt(promptText) {
      manualInput.value = promptText;
      processTextInput();
    }

    btnWakePhrase.addEventListener('click', () => {
      playChime('start');
      usePrompt("Hey SEFA");
    });

    async function makeGeminiCall(userQuery) {
      const payloadContents = [];
      state.history.slice(-10).forEach(item => {
        payloadContents.push({ role: item.role === 'assistant' ? 'model' : 'user', parts: [{ text: item.text }] });
      });
      payloadContents.push({ role: 'user', parts: [{ text: userQuery }] });

      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: payloadContents, systemInstruction: { parts: [{ text: systemPrompt }] } })
        });
        const result = await response.json();
        return result.candidates?.?.content?.parts?.?.text || getPremiumFallbackResponse(userQuery);
      } catch (err) {
        return getPremiumFallbackResponse(userQuery);
      }
    }

    function getPremiumFallbackResponse(query) {
      const lower = query.toLowerCase();
      if (lower.includes("hello") || lower.includes("hi")) return "Hello there! SEFA here. How can I assist you today?";
      if (lower.includes("who are you")) return "I am SEFA AI, your premium interactive personal voice companion.";
      return `Processed your request: "${query}". Systems are standing by and fully operational!`;
    }

    function renderChatHistory() {
      if (state.history.length === 0) {
        welcomeScreen.classList.remove('hidden');
        messagesList.innerHTML = '';
        return;
      }
      welcomeScreen.classList.add('hidden');
      messagesList.innerHTML = '';
      
      state.history.forEach((msg, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = `flex flex-col max-w-[85%] ${msg.role === 'user' ? 'self-end' : 'self-start'} msg-transition`;
        const cardClass = msg.role === 'user' 
          ? 'bg-gradient-to-tr from-brand-purple to-brand-pink text-white rounded-2xl rounded-tr-sm px-4 py-3 shadow-md' 
          : 'glassmorphic text-slate-100 rounded-2xl rounded-tl-sm px-4 py-3 shadow-md border border-white/5';

        wrapper.innerHTML = `
          <span class="text-[9px] uppercase tracking-wider font-extrabold mb-1 ${msg.role === 'user' ? 'text-white/70 self-end' : 'text-brand-pink'}">${msg.role === 'user' ? 'You' : 'SEFA'}</span>
          <div class="${cardClass}"><p class="text-xs leading-relaxed font-medium select-text">${msg.text}</p></div>
        `;
        messagesList.appendChild(wrapper);
      });
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function appendMessage(role, text) {
      state.history.push({ role, text });
      localStorage.setItem('sefa_chat_history', JSON.stringify(state.history));
      renderChatHistory();
    }

    function speakText(text) {
      if (!synth) return;
      synth.cancel();
      setSystemState('speaking');

      const cleanText = text.replace(/[*_`#\-\n]/g, ' ').trim();
      const utterance = new SpeechSynthesisUtterance(cleanText);
      const voices = synth.getVoices();
      
      if (voices.length > 0 && state.voiceConfig.voiceIndex >= 0) {
        utterance.voice = voices[state.voiceConfig.voiceIndex];
      }
      utterance.rate = state.voiceConfig.rate;
      utterance.pitch = state.voiceConfig.pitch;

      utterance.onend = () => setSystemState('idle');
      utterance.onerror = () => setSystemState('idle');
      synth.speak(utterance);
    }

    async function processCommand(userQuery) {
      if (!userQuery.trim()) return;
      appendMessage('user', userQuery);
      setSystemState('thinking');

      const localResponse = parseSmartCommands(userQuery);
      if (localResponse) {
        setTimeout(() => {
          appendMessage('assistant', localResponse);
          speakText(localResponse);
        }, 600);
        return;
      }

      const responseText = await makeGeminiCall(userQuery);
      appendMessage('assistant', responseText);
      speakText(responseText);
    }

    function processTextInput() {
      const text = manualInput.value.trim();
      if (!text) return;
      manualInput.value = '';
      processCommand(text);
    }

    btnSendText.addEventListener('click', processTextInput);
    manualInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') processTextInput(); });

    let recognitionInstance = null;
    if (SpeechRecognition) {
      recognitionInstance = new SpeechRecognition();
      recognitionInstance.interimResults = false;
      recognitionInstance.lang = 'en-US';

      recognitionInstance.onstart = () => {
        setSystemState('listening');
        playChime('start');
        liveTranscriptText.textContent = 'Listening...';
        liveTranscriptOverlay.classList.remove('hidden');
      };

      recognitionInstance.onresult = (event) => {
        const transcript = event.results.transcript;
        if (transcript) {
          liveTranscriptText.textContent = transcript;
          processCommand(transcript);
        }
      };

      recognitionInstance.onerror = () => setSystemState('idle');
      recognitionInstance.onend = () => setSystemState('idle');
    }

    btnMicTrigger.addEventListener('click', () => {
      if (state.isSpeaking) {
        if (synth) synth.cancel();
        setSystemState('idle');
        return;
      }
      if (!recognitionInstance) {
        alert("Web Speech is not supported in this browser layout. Try using terminal textual inputs instead!");
        return;
      }
      if (state.isListening) {
        recognitionInstance.stop();
      } else {
        recognitionInstance.start();
      }
    });
  </script>
</body>

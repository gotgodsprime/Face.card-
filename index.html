<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aeterna Bible</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(20px); }
        .dark-glass { background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(20px); }
        .animate-shake { animation: shake 0.3s ease-in-out; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="w-[375px] h-[812px] bg-white rounded-[50px] shadow-2xl overflow-hidden relative border-[8px] border-black">
        
        <div id="home-screen" class="p-6 pt-16">
            <header class="flex justify-between items-center mb-8">
                <div id="logo-trigger" class="w-12 h-12 bg-indigo-600 rounded-2xl flex items-center justify-center text-white font-bold text-2xl shadow-lg cursor-pointer">
                    †
                </div>
                <h1 class="text-2xl font-bold text-gray-900">Aeterna</h1>
            </header>

            <input type="text" placeholder="Search scripture..." class="w-full p-4 rounded-2xl bg-gray-100 border-none outline-none mb-8">

            <div class="space-y-4">
                <div class="p-6 bg-gray-900 text-white rounded-3xl">
                    <p class="text-sm italic mb-2">"For God so loved the world..."</p>
                    <span class="text-xs font-bold text-indigo-400">John 3:16</span>
                </div>
            </div>
        </div>

        <div id="secure-gate" class="absolute inset-0 bg-black/50 backdrop-blur-2xl hidden flex flex-col items-center justify-center p-8 text-white">
            <h2 class="text-2xl font-semibold mb-8">Enter Clearance</h2>
            <div id="pin-display" class="flex gap-4 mb-12">
                <div class="w-4 h-4 rounded-full border border-white/50"></div>
                <div class="w-4 h-4 rounded-full border border-white/50"></div>
                <div class="w-4 h-4 rounded-full border border-white/50"></div>
                <div class="w-4 h-4 rounded-full border border-white/50"></div>
            </div>
            <div class="grid grid-cols-3 gap-8">
                <button onclick="addPin('1')" class="text-2xl">1</button>
                <button onclick="addPin('2')" class="text-2xl">2</button>
                <button onclick="addPin('3')" class="text-2xl">3</button>
                <button onclick="addPin('4')" class="text-2xl">4</button>
                <button onclick="addPin('5')" class="text-2xl">5</button>
                <button onclick="addPin('6')" class="text-2xl">6</button>
            </div>
        </div>
    </div>

    <script>
        // Interaction Logic
        const logo = document.getElementById('logo-trigger');
        const gate = document.getElementById('secure-gate');
        let pin = "";

        // Long Press Logic
        let pressTimer;
        logo.addEventListener('mousedown', () => {
            pressTimer = setTimeout(() => gate.classList.remove('hidden'), 1000);
        });
        logo.addEventListener('mouseup', () => clearTimeout(pressTimer));

        // PIN Logic
        function addPin(num) {
            pin += num;
            if(pin.length === 4) {
                if(pin === "1947") { alert("Access Granted"); gate.classList.add('hidden'); }
                else { gate.classList.add('animate-shake'); setTimeout(() => { gate.classList.remove('animate-shake'); pin=""; }, 300); }
            }
        }
    </script>
</body>
</html>

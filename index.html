<!DOCTYPE html>
<html>
<head>
  <title>Lecture Time Alert</title>
</head>
<body style="font-family: Arial; text-align:center; margin-top:50px;">

  <h2>Lecture Time Checker</h2>

  <p>Current Time: <span id="time"></span></p>

  <h3>Set Lecture Time (24-hour format)</h3>
  <input type="time" id="lectureTime">
  <button onclick="startCheck()">Start</button>

  <script>
    // Show live time
    setInterval(() => {
      const now = new Date();
      document.getElementById("time").innerText =
        now.toLocaleTimeString();
    }, 1000);

    let targetTime = "9:30";

    function startCheck() {
      targetTime = document.getElementById("lectureTime").value;
      alert("Lecture reminder set for " + targetTime);
    }

    // Check every second
    setInterval(() => {
      if (!targetTime) return;

      const now = new Date();
      const current = now.toTimeString().slice(0,5); // HH:MM

      if (current === targetTime) {
        alert("📢 It's time! Lecture is starting now!");
        targetTime = ""; // stop repeating
      }
    }, 1000);
  </script>

</body>
</html>

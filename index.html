<!DOCTYPE html>
<html lang="en">
<head>

    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Core 3D Graphics Core & Camera Rigging -->

    <style>
        body {
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            background-color: #05070f;
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        /* Premium Antigravity Glassmorphism UI Panels */
        .glassmorphic {
            background: rgba(10, 15, 30, 0.65);
            backdrop-filter: blur(20px) saturate(140%);
            -webkit-backdrop-filter: blur(20px) saturate(140%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.12);
        }

        /* Active Turn Fluid Indicators */
        .active-turn-p1 {
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.25);
            border-color: rgba(16, 185, 129, 0.5);
            background: rgba(16, 185, 129, 0.12);
        }
        .active-turn-p2 {
            box-shadow: 0 0 25px rgba(6, 182, 212, 0.25);
            border-color: rgba(6, 182, 212, 0.5);
            background: rgba(6, 182, 212, 0.12);
        }

        /* Micro-interactions & Spring Curves */
        .interactive-element {
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .interactive-element:hover:not(:disabled) {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.25);
        }
        .interactive-element:active:not(:disabled) {
            transform: translateY(1px) scale(0.98);
        }

        /* Modernized Custom Linear Slider Rails */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.9);
            cursor: pointer;
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.35);
        }
    </style>
</head>

    <!-- 3D Core Simulation Engine Scripts -->
    <script>
        // --- PRODUCTION NETWORK KEY CONFIGURATION MAP ---
        const SUPABASE_URL = "https://wjvvczhjixidfhjsfypu.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndqdnZjemhqaXhpZGZoanNmeXB1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NTM2NDcsImV4cCI6MjA5NTAyOTY0N30.DPt1V5dTtLRCUAkKudHG1vJbIWl_SmnuvkMDM3ZeH-8";
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // --- GLOBAL STATE STORAGE OBJECT ---
        const GameState = {
            // Room Mapping Attributes
            roomId: null,
            localPlayerId: null,
            isHost: false,
            playerSlot: null,
            supabaseChannel: null,

            // Mechanics Configurations
            isTableRolling: false,
            aimAngle: Math.PI, // 180 degrees initial pointing
            strikePower: 40,
            cueBall: null,
            balls: [],
            p1: { isTurn: true },
            p2: { isTurn: false }
        };

        const PHYSICS_CONFIG = {
            ballRadius: 0.12,
            cushionRestitution: 0.75,
            ballRestitution: 0.95,
            tableFriction: 0.988,
            minimumVelocity: 0.005,
            bounds: { minX: -2.35, maxX: 2.35, minZ: -4.70, maxZ: 4.70 }
        };

        const POCKET_LAYOUT = [
            { x: -2.35, z: -4.70 }, { x: 0, z: -4.75 }, { x: 2.35, z: -4.70 },
            { x: -2.35, z:  4.70 }, { x: 0, z:  4.75 }, { x: 2.35, z:  4.70 }
        ];
        const POCKET_CAPTURE_RADIUS = 0.28;

        // Three.js Graphics Context Framework
        let scene, camera, renderer, controls;
        let aimLine, cueStickMesh;

        // --- PHYSICS VECTOR SYSTEM RESOLUTION ---
        function resolveCushionCollisions(ball) {
            if (!ball.isActive) return;

            if (ball.position.x - PHYSICS_CONFIG.ballRadius < PHYSICS_CONFIG.bounds.minX) {
                ball.position.x = PHYSICS_CONFIG.bounds.minX + PHYSICS_CONFIG.ballRadius;
                ball.velocity.x = -ball.velocity.x * PHYSICS_CONFIG.cushionRestitution;
            } else if (ball.position.x + PHYSICS_CONFIG.ballRadius > PHYSICS_CONFIG.bounds.maxX) {
                ball.position.x = PHYSICS_CONFIG.bounds.maxX - PHYSICS_CONFIG.ballRadius;
                ball.velocity.x = -ball.velocity.x * PHYSICS_CONFIG.cushionRestitution;
            }

            if (ball.position.z - PHYSICS_CONFIG.ballRadius < PHYSICS_CONFIG.bounds.minZ) {
                ball.position.z = PHYSICS_CONFIG.bounds.minZ + PHYSICS_CONFIG.ballRadius;
                ball.velocity.z = -ball.velocity.z * PHYSICS_CONFIG.cushionRestitution;
            } else if (ball.position.z + PHYSICS_CONFIG.ballRadius > PHYSICS_CONFIG.bounds.maxZ) {
                ball.position.z = PHYSICS_CONFIG.bounds.maxZ - PHYSICS_CONFIG.ballRadius;
                ball.velocity.z = -ball.velocity.z * PHYSICS_CONFIG.cushionRestitution;
            }
        }

        function resolveBallCollisions(ballA, ballB) {
            if (!ballA.isActive || !ballB.isActive) return;

            let dx = ballB.position.x - ballA.position.x;
            let dz = ballB.position.z - ballA.position.z;
            let distance = Math.sqrt(dx * dx + dz * dz);
            let minDistance = PHYSICS_CONFIG.ballRadius * 2;

            if (distance >= minDistance) return;

            // Step 1: Position correction to resolve overlap binding
            let overlap = minDistance - distance;
            let offsetX = (dx / distance) * (overlap / 2);
            let offsetZ = (dz / distance) * (overlap / 2);

            ballA.position.x -= offsetX;
            ballA.position.z -= offsetZ;
            ballB.position.x += offsetX;
            ballB.position.z += offsetZ;

            // Step 2: Elastic momentum matrix transformation
            let nx = dx / distance;
            let nz = dz / distance;

            let kx = ballA.velocity.x - ballB.velocity.x;
            let kz = ballA.velocity.z - ballB.velocity.z;
            let relativeVelocityNormal = kx * nx + kz * nz;

            if (relativeVelocityNormal > 0) {
                let impulseMagnitude = (1 + PHYSICS_CONFIG.ballRestitution) * relativeVelocityNormal / 2;
                ballA.velocity.x -= impulseMagnitude * nx;
                ballA.velocity.z -= impulseMagnitude * nz;
                ballB.velocity.x += impulseMagnitude * nx;
                ballB.velocity.z += impulseMagnitude * nz;
            }
        }

        function checkPocketDropDynamics() {
            const pocketTray = document.getElementById('pocketed-tray');

            GameState.balls.forEach(ball => {
                if (!ball.isActive) return;

                POCKET_LAYOUT.forEach(pocket => {
                    let dx = ball.position.x - pocket.x;
                    let dz = ball.position.z - pocket.z;
                    let distance = Math.sqrt(dx * dx + dz * dz);

                    if (distance < POCKET_CAPTURE_RADIUS) {
                        ball.isActive = false;
                        ball.velocity.set(0, 0, 0);
                        scene.remove(ball.mesh);

                        if (ball.isCueBall) {
                            triggerFoulNotification("SCRATCH FOUL", "Cue ball run into pocket. Penalty applied.");
                            setTimeout(respawnCueBall, 1500);
                        } else {
                            const indicatorNode = document.createElement('div');
                            indicatorNode.className = `w-4 h-4 rounded-full border border-white/20 shadow-inner`;
                            indicatorNode.style.backgroundColor = ball.colorHEX;
                            pocketTray.appendChild(indicatorNode);
                            triggerFoulNotification("OBJECT POTTED", `Object ball #${ball.id} secured smoothly.`);
                        }
                    }
                });
            });
        }

        function checkTableRestingState() {
            if (!GameState.isTableRolling) return;

            let componentsAreMoving = GameState.balls.some(ball => 
                ball.isActive && (ball.velocity.x !== 0 || ball.velocity.z !== 0)
            );

            if (!componentsAreMoving) {
                GameState.isTableRolling = false;
                
                const strikeBtn = document.getElementById('btn-strike');
                strikeBtn.disabled = false;
                strikeBtn.style.opacity = '1';

                if (GameState.isHost) {
                    switchTurns();
                    broadcastPhysicsSnapshot();
                }
            }
        }

        function respawnCueBall() {
            GameState.cueBall.position.set(0, 0, 2.35);
            GameState.cueBall.velocity.set(0, 0, 0);
            GameState.cueBall.isActive = true;
            scene.add(GameState.cueBall.mesh);
            updateHUDStatus("Cue ball returned to table.");
            if (GameState.isHost) broadcastPhysicsSnapshot();
        }

        function switchTurns() {
            GameState.p1.isTurn = !GameState.p1.isTurn;
            GameState.p2.isTurn = !GameState.p2.isTurn;

            const p1Card = document.getElementById('p1-card');
            const p2Card = document.getElementById('p2-card');
            const p1Ind = document.getElementById('p1-indicator');
            const p2Ind = document.getElementById('p2-indicator');

            if (GameState.p1.isTurn) {
                p1Card.className = "flex items-center gap-3 px-4 py-1.5 rounded-full transition-all duration-500 active-turn-p1 opacity-100";
                p2Card.className = "flex items-center gap-3 px-4 py-1.5 rounded-full transition-all duration-500 opacity-40";
                p1Ind.className = "w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping";
                p2Ind.className = "w-2.5 h-2.5 rounded-full bg-slate-500";
                updateHUDStatus("Player 1's turn.");
            } else {
                p2Card.className = "flex items-center gap-3 px-4 py-1.5 rounded-full transition-all duration-500 active-turn-p2 opacity-100";
                p1Card.className = "flex items-center gap-3 px-4 py-1.5 rounded-full transition-all duration-500 opacity-40";
                p2Ind.className = "w-2.5 h-2.5 rounded-full bg-cyan-400 animate-ping";
                p1Ind.className = "w-2.5 h-2.5 rounded-full bg-slate-500";
                updateHUDStatus("Player 2's turn.");
            }
        }

        // --- THREE.JS GRAPHICS ENVIRONMENT CONSTRUCTION ---
        function initSceneEngine() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color('#03050a');

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 6, 8);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.05; // Prevent camera under-table clipping

            // Lighting Setup
            const ambient = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambient);

            const tableLight = new THREE.DirectionalLight(0xffffff, 0.85);
            tableLight.position.set(0, 8, 0);
            tableLight.castShadow = true;
            scene.add(tableLight);

            buildTableGeometry();
            generateMatchBalls();
            createAimVectorGraphic();
            buildCueStickGeometry();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function buildTableGeometry() {
            // Felt Bed Layer
            const bedGeom = new THREE.BoxGeometry(4.7, 0.1, 9.4);
            const bedMat = new THREE.MeshStandardMaterial({ color: '#0f172a', roughness: 0.72 });
            const bed = new THREE.Mesh(bedGeom, bedMat);
            bed.position.y = -0.05;
            bed.receiveShadow = true;
            scene.add(bed);

            // Rails
            const railMat = new THREE.MeshStandardMaterial({ color: '#1e293b', roughness: 0.2 });
            
            const longRailGeom = new THREE.BoxGeometry(0.2, 0.3, 9.4);
            const leftRail = new THREE.Mesh(longRailGeom, railMat);
            leftRail.position.set(-2.45, 0.1, 0);
            scene.add(leftRail);

            const rightRail = leftRail.clone();
            rightRail.position.x = 2.45;
            scene.add(rightRail);

            const shortRailGeom = new THREE.BoxGeometry(5.1, 0.3, 0.2);
            const topRail = new THREE.Mesh(shortRailGeom, railMat);
            topRail.position.set(0, 0.1, -4.8);
            scene.add(topRail);

            const bottomRail = topRail.clone();
            bottomRail.position.z = 4.8;
            scene.add(bottomRail);

            // Visual Hole Indicators
            POCKET_LAYOUT.forEach(p => {
                const holeGeom = new THREE.CylinderGeometry(POCKET_CAPTURE_RADIUS, POCKET_CAPTURE_RADIUS, 0.02, 24);
                const holeMat = new THREE.MeshBasicMaterial({ color: '#020408' });
                const hole = new THREE.Mesh(holeGeom, holeMat);
                hole.position.set(p.x, 0.002, p.z);
                scene.add(hole);
            });
        }

        function generateMatchBalls() {
            const ballGeom = new THREE.SphereGeometry(PHYSICS_CONFIG.ballRadius, 32, 32);

            // Cue Ball Setup
            const cueMat = new THREE.MeshStandardMaterial({ color: '#f8fafc', roughness: 0.12, metalness: 0.05 });
            const cueMesh = new THREE.Mesh(ballGeom, cueMat);
            cueMesh.castShadow = true;

            GameState.cueBall = {
                id: 0,
                isCueBall: true,
                isActive: true,
                mesh: cueMesh,
                position: new THREE.Vector3(0, PHYSICS_CONFIG.ballRadius, 2.35),
                velocity: new THREE.Vector3(0, 0, 0),
                colorHEX: '#f8fafc'
            };
            scene.add(cueMesh);
            GameState.balls.push(GameState.cueBall);

            // Object Rack Placement Matrix
            const hexColors = ['#f59e0b', '#3b82f6', '#ef4444', '#8b5cf6', '#f97316', '#10b981', '#b91c1c', '#111827', '#eab308'];
            let idx = 0;

            const rackCenterZ = -2.35;
            const rowCount = 4;

            for (let r = 0; r < rowCount; r++) {
                for (let c = 0; c <= r; c++) {
                    idx++;
                    const objMat = new THREE.MeshStandardMaterial({ color: hexColors[idx % hexColors.length], roughness: 0.12 });
                    const objMesh = new THREE.Mesh(ballGeom, objMat);
                    objMesh.castShadow = true;

                    // Triangular offsets
                    const xOffset = (c - r * 0.5) * (PHYSICS_CONFIG.ballRadius * 2.1);
                    const zOffset = rackCenterZ - r * (PHYSICS_CONFIG.ballRadius * 1.8);

                    const targetBall = {
                        id: idx,
                        isCueBall: false,
                        isActive: true,
                        mesh: objMesh,
                        position: new THREE.Vector3(xOffset, PHYSICS_CONFIG.ballRadius, zOffset),
                        velocity: new THREE.Vector3(0, 0, 0),
                        colorHEX: hexColors[idx % hexColors.length]
                    };
                    scene.add(objMesh);
                    GameState.balls.push(targetBall);
                }
            }
        }

        function createAimVectorGraphic() {
            const points = [new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, -2)];
            const aimGeom = new THREE.BufferGeometry().setFromPoints(points);
            const aimMat = new THREE.LineDashedMaterial({ color: '#22d3ee', dashSize: 0.15, gapSize: 0.1 });
            
            aimLine = new THREE.Line(aimGeom, aimMat);
            aimLine.computeLineDistances();
            scene.add(aimLine);
        }

        function buildCueStickGeometry() {
            // Tapered Cylinder representing a high-premium wood pool cue stick
            const cueLength = 3.5;
            const cueGeom = new THREE.CylinderGeometry(0.015, 0.03, cueLength, 16);
            
            // Shifting structural pivot basis to tip point rather than geometric center
            cueGeom.translate(0, cueLength / 2, 0);
            cueGeom.rotateX(Math.PI / 2); // Orient horizontal along Z axis

            const cueMat = new THREE.MeshStandardMaterial({ 
                color: '#d97706', 
                roughness: 0.4, 
                metalness: 0.1 
            });
            
            cueStickMesh = new THREE.Mesh(cueGeom, cueMat);
            cueStickMesh.castShadow = true;
            scene.add(cueStickMesh);
        }

        function updateAimIndicatorLine() {
            if (!GameState.cueBall || !GameState.cueBall.isActive || GameState.isTableRolling) {
                aimLine.visible = false;
                cueStickMesh.visible = false;
                return;
            }

            const checkMyTurn = (GameState.p1.isTurn && GameState.playerSlot === 'p1') || 
                               (GameState.p2.isTurn && GameState.playerSlot === 'p2');
            
            aimLine.visible = checkMyTurn;
            cueStickMesh.visible = true; // Retain global transformation visibility matrix across instances

            // 1. Core Alignments for Aim Trace Overlay Line
            aimLine.position.copy(GameState.cueBall.position);
            aimLine.position.y = 0.02; 
            aimLine.rotation.y = -GameState.aimAngle;

            // 2. Structural Positioning Logic for the 3D Cue Stick Model
            // Calculate direction vectors stemming directly from rotational properties
            const dirX = Math.sin(GameState.aimAngle);
            const dirZ = Math.cos(GameState.aimAngle);

            // Establish physical setback distance offset proportional to active tension intensity (Shot Power metric)
            const structuralBaseGap = PHYSICS_CONFIG.ballRadius + 0.05;
            const elasticPullbackOffset = (GameState.strikePower / 100) * 0.8;
            const integratedRangeDistance = structuralBaseGap + elasticPullbackOffset;

            cueStickMesh.position.set(
                GameState.cueBall.position.x - dirX * integratedRangeDistance,
                GameState.cueBall.position.y + 0.04, // Elevate slightly above plane surface alignment thresholds
                GameState.cueBall.position.z - dirZ * integratedRangeDistance
            );

            // Sync heading parameters to align with directional trajectories smoothly
            cueStickMesh.rotation.y = -GameState.aimAngle + Math.PI;
        }

        // --- INTERACTION HOOK HANDLERS ---
        function initControlSystems() {
            const aimSlider = document.getElementById('aim-slider');
            const angleDisplay = document.getElementById('angle-display');
            const powerSlider = document.getElementById('power-slider');
            const powerPercentage = document.getElementById('power-percentage');
            const btnStrike = document.getElementById('btn-strike');

            aimSlider.addEventListener('input', (e) => {
                const checkMyTurn = (GameState.p1.isTurn && GameState.playerSlot === 'p1') || 
                                   (GameState.p2.isTurn && GameState.playerSlot === 'p2');
                if (!checkMyTurn || GameState.isTableRolling) {
                    aimSlider.value = Math.round(GameState.aimAngle * (180 / Math.PI));
                    return;
                }

                GameState.aimAngle = parseFloat(e.target.value) * (Math.PI / 180);
                angleDisplay.textContent = `${e.target.value}°`;
                updateAimIndicatorLine();

                GameState.supabaseChannel.send({
                    type: 'broadcast',
                    event: 'aim-sync',
                    payload: { angle: e.target.value, power: GameState.strikePower }
                });
            });

            document.getElementById('aim-left-fine').addEventListener('click', () => {
                let currentDeg = Math.round(GameState.aimAngle * (180 / Math.PI));
                currentDeg = (currentDeg - 1 + 360) % 360;
                aimSlider.value = currentDeg;
                aimSlider.dispatchEvent(new Event('input'));
            });

            document.getElementById('aim-right-fine').addEventListener('click', () => {
                let currentDeg = Math.round(GameState.aimAngle * (180 / Math.PI));
                currentDeg = (currentDeg + 1) % 360;
                aimSlider.value = currentDeg;
                aimSlider.dispatchEvent(new Event('input'));
            });

            powerSlider.addEventListener('input', (e) => {
                GameState.strikePower = parseFloat(e.target.value);
                powerPercentage.textContent = `${e.target.value}%`;
                updateAimIndicatorLine();

                // Dispatch active transformation update patterns down web-sockets pipelines instantly
                const checkMyTurn = (GameState.p1.isTurn && GameState.playerSlot === 'p1') || 
                                   (GameState.p2.isTurn && GameState.playerSlot === 'p2');
                if (checkMyTurn && !GameState.isTableRolling) {
                    GameState.supabaseChannel.send({
                        type: 'broadcast',
                        event: 'aim-sync',
                        payload: { angle: aimSlider.value, power: GameState.strikePower }
                    });
                }
            });

            btnStrike.addEventListener('click', () => {
                const checkMyTurn = (GameState.p1.isTurn && GameState.playerSlot === 'p1') || 
                                   (GameState.p2.isTurn && GameState.playerSlot === 'p2');

                if (!checkMyTurn || GameState.isTableRolling || !GameState.cueBall.isActive) return;

                executeCueStrike();

                GameState.supabaseChannel.send({
                    type: 'broadcast',
                    event: 'strike-ignite',
                    payload: { power: GameState.strikePower, angle: GameState.aimAngle }
                });
            });

            // Camera Presets Buttons
            document.getElementById('btn-camera-top').addEventListener('click', () => {
                camera.position.set(0, 9, 0.01);
                controls.target.set(0, 0, 0);
            });

            document.getElementById('btn-camera-reset').addEventListener('click', () => {
                camera.position.set(0, 6, 8);
                controls.target.set(0, 0, 0);
            });

            document.getElementById('btn-share').addEventListener('click', () => {
                navigator.clipboard.writeText(window.location.href);
                triggerFoulNotification("LINK COPIED", "Invite URL pinned to your clipboard buffer.");
            });
        }

        function executeCueStrike() {
            GameState.isTableRolling = true;
            
            const strikeBtn = document.getElementById('btn-strike');
            strikeBtn.disabled = true;
            strikeBtn.style.opacity = '0.3';

            const forceVectorX = Math.sin(GameState.aimAngle);
            const forceVectorZ = Math.cos(GameState.aimAngle);

            const scaleFactor = 0.18;
            const velocityMagnitude = GameState.strikePower * scaleFactor;

            GameState.cueBall.velocity.x = forceVectorX * velocityMagnitude;
            GameState.cueBall.velocity.z = forceVectorZ * velocityMagnitude;

            updateAimIndicatorLine();
            updateHUDStatus("Balls scattered across table...");
        }

        // --- MULTIPLAYER SUPABASE REALTIME ROUTER ---
        function runMultiplayerSessionRouter() {
            const urlParams = new URLSearchParams(window.location.search);
            let activeRoomCode = urlParams.get('room');

            if (!activeRoomCode) {
                activeRoomCode = Math.random().toString(36).substring(2, 8).toUpperCase();
                urlParams.set('room', activeRoomCode);
                window.history.pushState(null, '', window.location.pathname + '?' + urlParams.toString());
                
                GameState.isHost = true;
                GameState.playerSlot = 'p1';
            } else {
                GameState.isHost = false;
                GameState.playerSlot = 'p2';
            }

            GameState.roomId = activeRoomCode;
            GameState.localPlayerId = crypto.randomUUID();

            updateHUDStatus(`Connecting socket server [Room: ${activeRoomCode}]...`);

            GameState.supabaseChannel = supabaseClient.channel(`pool_match:${activeRoomCode}`, {
                config: { broadcast: { self: false, ack: true } }
            });

            GameState.supabaseChannel
                .on('broadcast', { event: 'player-joined' }, (payload) => handleRemotePlayerConnect(payload))
                .on('broadcast', { event: 'aim-sync' }, (payload) => handleRemoteAimSync(payload))
                .on('broadcast', { event: 'strike-ignite' }, (payload) => handleRemoteStrike(payload))
                .on('broadcast', { event: 'physics-state' }, (payload) => handleRemotePhysicsSync(payload))
                .subscribe(async (status) => {
                    if (status === 'SUBSCRIBED') {
                        await GameState.supabaseChannel.send({
                            type: 'broadcast',
                            event: 'player-joined',
                            payload: { id: GameState.localPlayerId, assignedSlot: GameState.playerSlot }
                        });
                        refreshInterfacePanels(activeRoomCode);
                    }
                });
        }

        function handleRemotePlayerConnect(payload) {
            if (GameState.isHost && GameState.playerSlot === 'p1') {
                document.getElementById('p2-name').textContent = "OPPONENT (P2)";
                broadcastPhysicsSnapshot();
            } else if (!GameState.isHost && GameState.playerSlot === 'p2') {
                document.getElementById('p1-name').textContent = "OPPONENT (P1)";
            }
            triggerFoulNotification("PLAYER CONNECTED", "Network lobby pairing complete.");
        }

        function handleRemoteAimSync(payload) {
            if (GameState.isTableRolling) return;
            const incomingAngle = payload.payload.angle;
            const incomingPower = payload.payload.power;
            
            GameState.aimAngle = parseFloat(incomingAngle) * (Math.PI / 180);
            if(incomingPower !== undefined) {
                GameState.strikePower = incomingPower;
            }

            document.getElementById('aim-slider').value = incomingAngle;
            document.getElementById('angle-display').textContent = `${incomingAngle}°`;
            updateAimIndicatorLine();
        }

        function handleRemoteStrike(payload) {
            GameState.strikePower = payload.payload.power;
            GameState.aimAngle = payload.payload.angle;
            executeCueStrike();
        }

        let upstreamTickCounter = 0;

        function broadcastPhysicsSnapshot() {
            if (!GameState.supabaseChannel) return;

            const packet = GameState.balls.map(b => ({
                id: b.id,
                x: b.position.x,
                z: b.position.z,
                vx: b.velocity.x,
                vz: b.velocity.z,
                active: b.isActive
            }));

            GameState.supabaseChannel.send({
                type: 'broadcast',
                event: 'physics-state',
                payload: { balls: packet, p1Turn: GameState.p1.isTurn }
            });
        }

        function handleRemotePhysicsSync(payload) {
            const cloudStates = payload.payload.balls;
            
            // Sync active Turn definitions to match Host status matrix
            if (GameState.p1.isTurn !== payload.payload.p1Turn) {
                GameState.p1.isTurn = payload.payload.p1Turn;
                GameState.p2.isTurn = !payload.payload.p1Turn;
                syncVisualTurnCardDisplays();
            }

            cloudStates.forEach(remoteState => {
                const localBall = GameState.balls.find(b => b.id === remoteState.id);
                if (!localBall) return;

                localBall.position.x = remoteState.x;
                localBall.position.z = remoteState.z;
                localBall.velocity.x = remoteState.vx;
                localBall.velocity.z = remoteState.vz;

                if (localBall.isActive !== remoteState.active) {
                    localBall.isActive = remoteState.active;
                    if (!remoteState.active) scene.remove(localBall.mesh);
                }
            });
        }

        function syncVisualTurnCardDisplays() {
            const p1Card = document.getElementById('p1-card');
            const p2Card = document.getElementById('p2-card');
            const p1Ind = document.getElementById('p1-indicator');
            const p2Ind = document.getElementById('p2-indicator');

            if (GameState.p1.isTurn) {
                p1Card.className = "flex items-center gap-3 px-4 py-1.5 rounded-full transition-all duration-500 active-turn-p1 opacity-100";
                p2Card.className = "flex items-center gap-3 px-4 py-1.5 rounded-full transition-all duration-500 opacity-40";
                p1Ind.className = "w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping";
                p2Ind.className = "w-2.5 h-2.5 rounded-full bg-slate-500";
                updateHUDStatus(GameState.playerSlot === 'p1' ? "Your turn." : "Opponent thinking...");
            } else {
                p2Card.className = "flex items-center gap-3 px-4 py-1.5 rounded-full transition-all duration-500 active-turn-p2 opacity-100";
                p1Card.className = "flex items-center gap-3 px-4 py-1.5 rounded-full transition-all duration-500 opacity-40";
                p2Ind.className = "w-2.5 h-2.5 rounded-full bg-cyan-400 animate-ping";
                p1Ind.className = "w-2.5 h-2.5 rounded-full bg-slate-500";
                updateHUDStatus(GameState.playerSlot === 'p2' ? "Your turn." : "Opponent thinking...");
            }
        }

        // --- TICK ITERATOR ENGINE LOOPS ---
        const physicsDeltaTime = 0.016; // Stable 60Hz physics clock segment

        function masterAnimationLoop() {
            requestAnimationFrame(masterAnimationLoop);

            if (GameState.isHost) {
                // Host machine performs mathematical evaluations
                GameState.balls.forEach(ball => {
                    if (!ball.isActive) return;

                    ball.position.x += ball.velocity.x * physicsDeltaTime;
                    ball.position.z += ball.velocity.z * physicsDeltaTime;

                    ball.velocity.x *= PHYSICS_CONFIG.tableFriction;
                    ball.velocity.z *= PHYSICS_CONFIG.tableFriction;

                    if (Math.abs(ball.velocity.x) < PHYSICS_CONFIG.minimumVelocity) ball.velocity.x = 0;
                    if (Math.abs(ball.velocity.z) < PHYSICS_CONFIG.minimumVelocity) ball.velocity.z = 0;

                    resolveCushionCollisions(ball);
                });

                for (let i = 0; i < GameState.balls.length; i++) {
                    for (let j = i + 1; j < GameState.balls.length; j++) {
                        resolveBallCollisions(GameState.balls[i], GameState.balls[j]);
                    }
                }

                checkPocketDropDynamics();
                checkTableRestingState();

                if (GameState.isTableRolling) {
                    upstreamTickCounter++;
                    if (upstreamTickCounter % 2 === 0) broadcastPhysicsSnapshot(); // Throttle pipeline to 30Hz
                }
            } else {
                // Secondary Guest interpolates positions directly from stream values
                GameState.balls.forEach(ball => {
                    if (!ball.isActive) return;
                    ball.position.x += ball.velocity.x * physicsDeltaTime;
                    ball.position.z += ball.velocity.z * physicsDeltaTime;
                });
                checkTableRestingState();
            }

            // Sync visual meshes to calculated positions
            GameState.balls.forEach(b => {
                if (b.isActive) b.mesh.position.copy(b.position);
            });

            updateAimIndicatorLine();

            controls.update();
            renderer.render(scene, camera);
        }

        // --- HELPER LAYOUT OPERATORS ---
        function refreshInterfacePanels(roomCode) {
            const p1Name = document.getElementById('p1-name');
            const p2Name = document.getElementById('p2-name');

            if (GameState.playerSlot === 'p1') {
                p1Name.textContent = "YOU (P1)";
                p2Name.textContent = "WAITING...";
                updateHUDStatus(`Room ${roomCode} active. Share link to begin.`);
            } else {
                p2Name.textContent = "YOU (P2)";
                p1Name.textContent = "OPPONENT (P1)";
                updateHUDStatus(`Connected to Room ${roomCode}. Match live.`);
            }
            syncVisualTurnCardDisplays();
        }

        function updateHUDStatus(text) {
            document.getElementById('game-status-text').textContent = text;
        }

        function triggerFoulNotification(title, description) {
            const banner = document.getElementById('notification-banner');
            document.getElementById('notif-title').textContent = title;
            document.getElementById('notif-desc').textContent = description;

            banner.className = "w-full glassmorphic px-6 py-4 rounded-2xl shadow-3xl border-yellow-500/20 scale-100 opacity-100 transition-all duration-500 flex items-center gap-4 text-left";
            setTimeout(() => {
                banner.className = "w-full glassmorphic px-6 py-4 rounded-2xl shadow-3xl border-yellow-500/10 scale-90 opacity-0 transition-all duration-500 flex items-center gap-4 text-left";
            }, 3000);
        }

        // BOOTSTRAP INITIALIZATION ON LOAD
        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            initSceneEngine();
            initControlSystems();
            runMultiplayerSessionRouter();
            masterAnimationLoop();
        });
    </script>
</body>
</html>

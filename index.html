  <script>
    // --- STABLE SECURE CONFIGURATION STATE ---
    let apiKey = ""; // Initial empty apiKey; dynamically managed through safe UI state
    let appId = typeof __app_id !== 'undefined' ? __app_id : 'sefa-assistant';
    let userName = "User";
    let isListening = false;
    let chatHistory = [];
    let synthesVoiceName = "";
    let isSefaSpeaking = false;
    let audioContext = null;

    // Web Speech API interfaces
    let SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let synthesis = window.speechSynthesis;
    let speechUtterance = null;
    let visualizerInterval = null;

    // --- APPLICATION STARTUP ---
    window.onload = function() {
      // Setup Initial State & Local Storage Data hydration
      loadConfigurationsFromStorage();
      initializeLucide();
      populateVoices();
      
      // Setup Event Listeners for Keyboard Submit on Enter Key
      document.getElementById('text-user-query').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          submitTextQuery();
        }
      });

      // Populate voice selection selector when system voices are loaded
      if (typeof synthesis !== 'undefined' && synthesis.onvoiceschanged !== undefined) {
        synthesis.onvoiceschanged = populateVoices;
      }

      // Initialize Sound Activation Context
      initAudioEngine();

      // Show system start notification
      showToast("SEFA AI", "Online and ready to help. Tap Mic!", "purple");
    };

    function initializeLucide() {
      if (typeof lucide !== 'undefined') {
        lucide.createIcons();
      }
    }

    // --- SOUND & AUDIO EFFECTS ENGINE ---
    function initAudioEngine() {
      window.addEventListener('click', () => {
        if (!audioContext) {
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }
      }, { once: true });
    }

    function playSound(type) {
      try {
        const audioEl = document.getElementById(type === 'activation' ? 'snd-activation' : 'snd-success');
        if (audioEl) {
          audioEl.currentTime = 0;
          audioEl.play().catch(e => {
            playSyntheticPing(type);
          });
        } else {
          playSyntheticPing(type);
        }
      } catch (e) {
        playSyntheticPing(type);
      }
    }

    // High fidelity fallback beep synth using programmatic AudioContext
    function playSyntheticPing(type) {
      if (!audioContext) return;
      try {
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.connect(gain);
        gain.connect(audioContext.destination);

        if (type === 'activation') {
          osc.frequency.setValueAtTime(440, audioContext.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, audioContext.currentTime + 0.15);
          gain.gain.setValueAtTime(0.1, audioContext.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.2);
          osc.start();
          osc.stop(audioContext.currentTime + 0.2);
        } else {
          osc.frequency.setValueAtTime(880, audioContext.currentTime);
          osc.frequency.exponentialRampToValueAtTime(1200, audioContext.currentTime + 0.1);
          gain.gain.setValueAtTime(0.08, audioContext.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.15);
          osc.start();
          osc.stop(audioContext.currentTime + 0.15);
        }
      } catch(err) {
        console.warn("AudioContext failed playing synthetic ping:", err);
      }
    }

    // --- LOCAL STORAGE HYDRATION & PERSISTENCE ---
    function loadConfigurationsFromStorage() {
      const savedKey = localStorage.getItem(`${appId}_gemini_key`);
      if (savedKey) {
        apiKey = savedKey;
        document.getElementById('api-key-input').value = savedKey;
      }

      const savedName = localStorage.getItem(`${appId}_user_name`);
      if (savedName) {
        userName = savedName;
        document.getElementById('user-name-input').value = savedName;
      } else {
        userName = "User";
        document.getElementById('user-name-input').value = "";
      }

      const savedVoice = localStorage.getItem(`${appId}_synthes_voice`);
      if (savedVoice) {
        synthesVoiceName = savedVoice;
      }

      const savedHistory = localStorage.getItem(`${appId}_chat_history`);
      if (savedHistory) {
        try {
          chatHistory = JSON.parse(savedHistory);
          if (chatHistory.length > 0) {
            document.getElementById('welcome-prompt').classList.add('hidden');
            const container = document.getElementById('chat-messages-container');
            container.classList.remove('hidden');
            
            chatHistory.forEach(msg => {
              appendMessageToUI(msg.role, msg.text, false);
            });
            scrollChatToBottom();
          }
        } catch(e) {
          console.error("Failed loading persistent chat logs:", e);
        }
      }
    }

    function saveConfigurations() {
      const keyVal = document.getElementById('api-key-input').value.trim();
      const nameVal = document.getElementById('user-name-input').value.trim();
      const selectVoiceVal = document.getElementById('voice-select').value;

      apiKey = keyVal;
      localStorage.setItem(`${appId}_gemini_key`, keyVal);

      userName = nameVal ? nameVal : "User";
      localStorage.setItem(`${appId}_user_name`, userName);

      synthesVoiceName = selectVoiceVal;
      localStorage.setItem(`${appId}_synthes_voice`, selectVoiceVal);

      showToast("Settings Updated", "Configuration changes successfully committed", "emerald");
      toggleSettingsModal();
    }

    function clearConversations() {
      localStorage.removeItem(`${appId}_chat_history`);
      chatHistory = [];
      document.getElementById('chat-messages-container').innerHTML = "";
      document.getElementById('chat-messages-container').classList.add('hidden');
      document.getElementById('welcome-prompt').classList.remove('hidden');
      showToast("Memory Cleared", "Assistant local timeline has been reset", "purple");
    }

    // --- SYSTEM SYNTHESIZER AND VOICE VOX SETTINGS ---
    function populateVoices() {
      if (typeof synthesis === 'undefined') return;
      
      const select = document.getElementById('voice-select');
      const voices = synthesis.getVoices();
      select.innerHTML = '<option value="default">System Default Voice</option>';

      voices.forEach(voice => {
        const option = document.createElement('option');
        option.value = voice.name;
        option.textContent = `${voice.name} (${voice.lang})`;
        if (voice.name === synthesVoiceName) {
          option.selected = true;
        }
        select.appendChild(option);
      });
    }

    function testSelectedVoice() {
      const selectVal = document.getElementById('voice-select').value;
      if (typeof synthesis === 'undefined') return;
      synthesis.cancel();

      const testUtterance = new SpeechSynthesisUtterance("Testing speech synthes configuration for SEFA AI");
      const voices = synthesis.getVoices();
      
      if (selectVal !== 'default') {
        const matchingVoice = voices.find(v => v.name === selectVal);
        if (matchingVoice) testUtterance.voice = matchingVoice;
      }

      synthesis.speak(testUtterance);
    }

    // --- CUSTOM BANNER NOTIFICATION (TOAST BANNER) ---
    function showToast(title, msg, type = "purple") {
      const banner = document.getElementById('toast-banner');
      const titleEl = document.getElementById('toast-title');
      const msgEl = document.getElementById('toast-msg');
      const iconBg = document.getElementById('toast-icon-bg');
      const icon = document.getElementById('toast-icon');

      titleEl.innerText = title;
      msgEl.innerText = msg;

      iconBg.className = "w-8 h-8 rounded-xl flex items-center justify-center shrink-0";
      
      if (type === "purple") {
        iconBg.classList.add("bg-brand-purple/20", "text-brand-purple");
        icon.setAttribute("data-lucide", "sparkles");
      } else if (type === "pink") {
        iconBg.classList.add("bg-brand-pink/20", "text-brand-pink");
        icon.setAttribute("data-lucide", "mic");
      } else if (type === "emerald") {
        iconBg.classList.add("bg-emerald-500/20", "text-emerald-400");
        icon.setAttribute("data-lucide", "check-circle-2");
      } else {
        iconBg.classList.add("bg-red-500/20", "text-red-400");
        icon.setAttribute("data-lucide", "alert-circle");
      }

      initializeLucide();

      banner.classList.remove('-translate-y-24', 'opacity-0');
      banner.classList.add('translate-y-0', 'opacity-100');

      setTimeout(() => {
        banner.classList.add('-translate-y-24', 'opacity-0');
        banner.classList.remove('translate-y-0', 'opacity-100');
      }, 3500);
    }

    // --- VOICE SPEECH RECOGNITION (TAP TO TALK) ---
    function toggleSpeechListening() {
      if (isSefaSpeaking) {
        stopSefaSpeaking();
      }

      if (isListening) {
        stopActiveListening();
      } else {
        startActiveListening();
      }
    }

    function startActiveListening() {
      if (!SpeechRecognition) {
        showToast("System Error", "Speech recognition API not supported on this browser context. Please use keyboard typing alternative.", "red");
        toggleKeyboardInput();
        return;
      }

      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.lang = "en-US";

      playSound('activation');

      isListening = true;
      document.getElementById('mic-icon').setAttribute("data-lucide", "square");
      initializeLucide();

      document.getElementById('mic-pulse-ring').classList.add('active-listening-ring');
      document.getElementById('mic-inner-sphere').classList.add('bg-brand-purple/20');
      document.getElementById('live-transcription-container').classList.remove('hidden');
      document.getElementById('voice-visualizer').classList.remove('opacity-20');
      document.getElementById('mic-guide-text').innerText = "Listening... Tap to stop";
      document.getElementById('mic-guide-text').classList.add('text-brand-pink');
      document.getElementById('live-transcription-text').innerText = "Say something, I'm listening...";

      startVisualizerSimulation();

      recognition.onstart = function() {
        updateSystemStatus(true, "Listening");
      };

      recognition.onerror = function(event) {
        console.error("Speech Recognition Error Event:", event);
        if (event.error === 'not-allowed') {
          showToast("Microphone Blocked", "Please grant microphone access to allow speech translation commands.", "red");
        }
        stopActiveListening();
      };

      recognition.onend = function() {
        stopActiveListening();
      };

      recognition.onresult = function(event) {
        let interimTranscript = "";
        let finalTranscript = "";

        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            finalTranscript += event.results[i].transcript;
          } else {
            interimTranscript += event.results[i].transcript;
          }
        }

        const currentProgress = finalTranscript || interimTranscript;
        if (currentProgress) {
          document.getElementById('live-transcription-text').innerText = currentProgress;
        }

        if (finalTranscript) {
          stopActiveListening();
          processUserPrompt(finalTranscript);
        }
      };

      recognition.start();
    }

    function stopActiveListening() {
      if (!isListening) return;
      isListening = false;

      if (recognition) {
        recognition.stop();
      }

      document.getElementById('mic-icon').setAttribute("data-lucide", "mic");
      initializeLucide();
      document.getElementById('mic-pulse-ring').classList.remove('active-listening-ring');
      document.getElementById('mic-inner-sphere').classList.remove('bg-brand-purple/20');
      document.getElementById('live-transcription-container').classList.add('hidden');
      document.getElementById('voice-visualizer').classList.add('opacity-20');
      document.getElementById('mic-guide-text').innerText = "Tap to speak to SEFA";
      document.getElementById('mic-guide-text').classList.remove('text-brand-pink');

      stopVisualizerSimulation();
      updateSystemStatus(false, "System Ready");
    }

    function startVisualizerSimulation() {
      const bars = document.querySelectorAll('.bar');
      visualizerInterval = setInterval(() => {
        bars.forEach(bar => {
          const randHeight = Math.floor(Math.random() * 32) + 6;
          bar.style.height = `${randHeight}px`;
        });
      }, 90);
    }

    function stopVisualizerSimulation() {
      if (visualizerInterval) {
        clearInterval(visualizerInterval);
      }
      const bars = document.querySelectorAll('.bar');
      bars.forEach(bar => {
        bar.style.height = '8px';
      });
    }

    // --- SPEECH OUTPUT SYNTHESIS ENGINE ---
    function playSefaVoiceOutput(text) {
      if (typeof synthesis === 'undefined') return;
      synthesis.cancel(); 

      speechUtterance = new SpeechSynthesisUtterance(text);
      
      const voices = synthesis.getVoices();
      if (synthesVoiceName && synthesVoiceName !== 'default') {
        const targetVoice = voices.find(v => v.name === synthesVoiceName);
        if (targetVoice) speechUtterance.voice = targetVoice;
      }

      speechUtterance.rate = 1.05; 
      speechUtterance.pitch = 1.02; 

      speechUtterance.onstart = function() {
        isSefaSpeaking = true;
        document.getElementById('speaking-indicator').classList.remove('hidden');
        document.getElementById('speaking-text-preview').innerText = text;
        updateSystemStatus(true, "Speaking");
      };

      speechUtterance.onend = function() {
        cleanupVoiceSpeakingState();
      };

      speechUtterance.onerror = function(event) {
        console.error("Speech Synthesis Error:", event);
        cleanupVoiceSpeakingState();
      };

      synthesis.speak(speechUtterance);
    }

    function stopSefaSpeaking() {
      if (typeof synthesis !== 'undefined') {
        synthesis.cancel();
      }
      cleanupVoiceSpeakingState();
    }

    function cleanupVoiceSpeakingState() {
      isSefaSpeaking = false;
      document.getElementById('speaking-indicator').classList.add('hidden');
      updateSystemStatus(false, "System Ready");
    }

    // --- KEYBOARD / TYPE FALLBACK TRIGGERS ---
    function toggleKeyboardInput() {
      const textContainer = document.getElementById('keyboard-input-container');
      const micContainer = document.getElementById('voice-interaction-container');
      const toggleIcon = document.getElementById('toggle-input-icon');
      const toggleText = document.getElementById('toggle-input-text');

      if (textContainer.classList.contains('hidden')) {
        textContainer.classList.remove('hidden');
        micContainer.classList.add('hidden');
        toggleIcon.setAttribute('data-lucide', 'mic');
        toggleText.innerText = "Use Voice";
        document.getElementById('text-user-query').focus();
      } else {
        textContainer.classList.add('hidden');
        micContainer.classList.remove('hidden');
        toggleIcon.setAttribute('data-lucide', 'keyboard');
        toggleText.innerText = "Use Typing";
      }
      initializeLucide();
    }

    function submitTextQuery() {
      const input = document.getElementById('text-user-query');
      const query = input.value.trim();
      if (!query) return;

      input.value = "";
      processUserPrompt(query);
    }

    function useSuggestedPrompt(text) {
      processUserPrompt(text);
    }

    function triggerWakePhraseSimulation() {
      playSound('activation');
      showToast("SEFA Listening", "Wake Phrase 'Hey SEFA' Simulated", "pink");
      setTimeout(() => {
        startActiveListening();
      }, 500);
    }

    // --- SYSTEM INTELLIGENCE & GEMINI AI PROCESSING PIPELINE ---
    async function processUserPrompt(promptText) {
      if (!promptText.trim()) return;

      stopSefaSpeaking();

      document.getElementById('welcome-prompt').classList.add('hidden');
      document.getElementById('chat-messages-container').classList.remove('hidden');

      appendMessageToUI("user", promptText);
      saveMessageToLocalHistory("user", promptText);

      document.getElementById('typing-indicator').classList.remove('hidden');
      updateSystemStatus(true, "Thinking...");
      scrollChatToBottom();

      const executedCommand = checkSmartCommands(promptText);
      if (executedCommand) {
        setTimeout(() => {
          handleAIResponse(executedCommand);
        }, 800);
        return;
      }

      detectAndStoreName(promptText);

      if (apiKey) {
        try {
          const aiReply = await callGeminiAPI(promptText);
          handleAIResponse(aiReply);
        } catch (error) {
          console.error("Primary API Query failed. Falling back to internal engine. Error details:", error);
          const fallbackReply = queryOfflineSystemIntelligence(promptText);
          handleAIResponse(fallbackReply);
        }
      } else {
        setTimeout(() => {
          const fallbackReply = queryOfflineSystemIntelligence(promptText);
          handleAIResponse(fallbackReply);
        }, 1200);
      }
    }

    function handleAIResponse(replyText) {
      document.getElementById('typing-indicator').classList.add('hidden');
      updateSystemStatus(false, "System Ready");

      playSound('success');

      appendMessageToUI("assistant", replyText);
      saveMessageToLocalHistory("assistant", replyText);

      playSefaVoiceOutput(replyText);
      scrollChatToBottom();
    }

    // --- GEMINI 2.5 FLASH CALL IMPLEMENTATION ---
    async function callGeminiAPI(query) {
      const systemPrompt = `You are "SEFA AI", a premium, smart, confident, and slightly playful personal AI assistant built into a gorgeous Apple-level premium web interface.
Current User's Name is: ${userName}.
Important guidelines:
1. Keep responses short, direct, human-like, and conversational (usually 1-3 sentences maximum).
2. Avoid verbose explanations or markdown-heavy structures like lists/code blocks unless requested.
3. Be playful and responsive. Never mention being a language model.
Current Day/Time is: Monday, June 1, 2026 at 2:56 PM.
Current Location context is: Accra, Ghana.`;

      const formattedContents = [];
      
      const limitHistory = chatHistory.slice(-8); 
      limitHistory.forEach(item => {
        formattedContents.push({
          role: item.role === 'user' ? 'user' : 'model',
          parts: [{ text: item.text }]
        });
      });

      // Secure dynamic validation checks prior to building runtime transaction payload
      if (formattedContents.length === 0 || formattedContents[formattedContents.length - 1].parts.text !== query) {
        formattedContents.push({
          role: 'user',
          parts: [{ text: query }]
        });
      }

      const payload = {
        contents: formattedContents,
        systemInstruction: {
          parts: [{ text: systemPrompt }]
        }
      };

      // Updated target context mapping endpoint url securely referencing official generative models
      const endpointUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;

      return await executeApiWithBackoff(endpointUrl, payload);
    }

    async function executeApiWithBackoff(url, payload, retries = 5, delay = 1000) {
      for (let i = 0; i < retries; i++) {
        try {
          const response = await fetch(url, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
          });

          if (response.ok) {
            const data = await response.json();
            const responseText = data.candidates?.?.content?.parts?.?.text;
            if (responseText) {
              return responseText.trim();
            } else {
              throw new Error("Empty candidate generation response");
            }
          } else {
            const errorDetails = await response.text();
            throw new Error(`API response code ${response.status}: ${errorDetails}`);
          }
        } catch (e) {
          if (i === retries - 1) throw e; 
          await new Promise(resolve => setTimeout(resolve, delay));
          delay *= 2; 
        }
      }
    }

    // --- INTEGRATED OFFLINE SMART COMMAND DICTIONARY & NATURAL AGENT MATCHES ---
    function checkSmartCommands(text) {
      const query = text.toLowerCase().trim();

      if (query.includes('what time') || query.includes('current time')) {
        const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        return `It is currently ${timeStr} here in Accra. Anything else I can schedule or check for you, ${userName}?`;
      }

      if (query.includes('attendance app') || query.includes('open my attendance')) {
        triggerSystemAppLaunchSimulation("Attendance Tracker");
        return `Launching your Attendance Tracker app immediately. Let me know if you need help logged in.`;
      }

      if (query.includes('send a message') || query.includes('send message')) {
        return `Who would you like me to message, ${userName}? Say the name, and I'll queue the text right up.`;
      }

      if (query === 'hey sefa' || query === 'sefa') {
        return `Hey! I'm here. What's on your mind?`;
      }

      return null; 
    }

    function detectAndStoreName(text) {
      const query = text.toLowerCase();
      const patterns = [
        /my name is ([a-zA-Z\s]{2,15})/i,
        /call me ([a-zA-Z\s]{2,15})/i,
        /i am ([a-zA-Z\s]{2,15})/i
      ];

      for (let pattern of patterns) {
        const match = query.match(pattern);
        if (match && match) {
          const matchedName = match.trim();
          userName = matchedName.charAt(0).toUpperCase() + matchedName.slice(1);
          localStorage.setItem(`${appId}_user_name`, userName);
          document.getElementById('user-name-input').value = userName;
          break;
        }
      }
    }

    // --- OFFLINE INTELLIGENCE BACKEND AGENT ---
    function queryOfflineSystemIntelligence(query) {
      const text = query.toLowerCase().trim();
      
      if (text.includes('hello') || text.includes('hi ') || text.includes('hey')) {
        return `Hello ${userName}! SEFA AI here. I'm connected and ready. How is your day going?`;
      }
      if (text.includes('how are you') || text.includes('doing ok')) {
        return `I'm feeling incredibly energetic, ${userName}! Ready to help you tackle whatever you need today. How are you doing?`;
      }
      if (text.includes('who are you') || text.includes('your name')) {
        return `I am SEFA AI, your personal intelligent voice assistant. I am modeled with premium Apple aesthetics to bring you natural conversations.`;
      }
      if (text.includes('fun fact') || text.includes('fact')) {
        const facts = [
          "Did you know that honey never spoils? Archaeologists have found pots of honey in ancient Egyptian tombs that are over three thousand years old and still perfectly edible!",
          "Here's a fun one: Bananas are berries, but strawberries aren't botanically classified as berries!",
          "The first computer bug was an actual real moth found trapped inside a relay in the Harvard Mark II computer in 1947.",
          "An octopus has three hearts and blue copper-based blood. Fascinating, isn't it?"
        ];
        return facts[Math.floor(Math.random() * facts.length)];
      }
      if (text.includes('joke')) {
        const jokes = [
          "Why did the computer go to the doctor? It had a virus!",
          "Why do programmers prefer dark mode? Because light attracts bugs!",
          "How many programmers does it take to change a light bulb? None, that's a hardware problem."
        ];
        return jokes[Math.floor(Math.random() * jokes.length)];
      }

      return `That's fascinating, ${userName}. I'm currently running on internal offline systems mode. Configure your API key in configurations for full generative powers!`;
    }

    function triggerSystemAppLaunchSimulation(appName) {
      showToast("App Launching", `Opening external application: ${appName}`, "emerald");
    }

    // --- UI GRAPHICS, CHAT BUILDERS, AND PORT SCROLLERS ---
    function appendMessageToUI(role, text, animate = true) {
      const container = document.getElementById('chat-messages-container');
      
      const messageRow = document.createElement('div');
      messageRow.className = `flex w-full ${role === 'user' ? 'justify-end' : 'justify-start'}`;

      const messageContent = document.createElement('div');
      
      if (role === 'user') {
        messageContent.className = `max-w-[80%] px-4 py-3 rounded-[24px] rounded-tr-sm bg-gradient-to-tr from-brand-purple to-brand-pink text-white text-sm leading-relaxed shadow-md ${animate ? 'bubble-in' : ''}`;
      } else {
        messageContent.className = `max-w-[80%] px-4 py-3 rounded-[24px] rounded-tl-sm glassmorphic-light text-neutral-100 text-sm leading-relaxed border border-white/5 shadow-sm ${animate ? 'bubble-in' : ''}`;
      }

      messageContent.innerText = text;
      
      messageRow.appendChild(messageContent);
      container.appendChild(messageRow);
    }

    function saveMessageToLocalHistory(role, text) {
      chatHistory.push({ role, text });
      if (chatHistory.length > 20) {
        chatHistory.shift();
      }
      localStorage.setItem(`${appId}_chat_history`, JSON.stringify(chatHistory));
    }

    function scrollChatToBottom() {
      const scroller = document.getElementById('chat-scroller');
      scroller.scrollTop = scroller.scrollHeight;
    }

    function updateSystemStatus(isActive, message) {
      const indicator = document.getElementById('status-indicator');
      const text = document.getElementById('status-text');

      text.innerText = message;
      if (isActive) {
        indicator.className = "w-2 h-2 rounded-full bg-brand-pink animate-ping";
      } else {
        indicator.className = "w-2 h-2 rounded-full bg-emerald-500 animate-pulse";
      }
    }

    // --- MODAL TRIGGERS ---
    function toggleSettingsModal() {
      const modal = document.getElementById('settings-modal');
      if (modal.classList.contains('hidden')) {
        modal.classList.remove('hidden');
        document.getElementById('api-key-input').value = apiKey;
        document.getElementById('user-name-input').value = userName === "User" ? "" : userName;
        populateVoices();
      } else {
        modal.classList.add('hidden');
      }
    }

    function toggleApiKeyVisibility() {
      const input = document.getElementById('api-key-input');
      const icon = document.getElementById('eye-icon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.setAttribute('data-lucide', 'eye-off');
      } else {
        input.type = 'password';
        icon.setAttribute('data-lucide', 'eye');
      }
      initializeLucide();
    }
  </script>

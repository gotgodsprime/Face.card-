<!DOCTYPE html>
<html>
<head>
    <title>Critical System Alert</title>
    <style>
        body {
            background: #000;
            color: #0f0;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            padding: 20px;
            margin: 0;
            overflow: hidden;
        }
       .blink {
            animation: blink 1s step-start infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }
        #progress {
            width: 100%;
            background: #222;
            border: 1px solid #0f0;
            margin: 10px 0;
        }
        #bar {
            width: 0%;
            height: 20px;
            background: #0f0;
        }
       .hidden { display: none; }
       .prank {
            color: #ff0;
            font-size: 24px;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <h1 class="blink">!!! SYSTEM BREACH DETECTED!!!</h1>
    <div id="log"></div>
    <div id="progress"><div id="bar"></div></div>
    <div id="final" class="hidden prank">
        😂 RELAX. Your PC is fine.<br>
        This was a prank by your mate.<br>
        <button onclick="window.close()">Close this and go roast them back</button>
    </div>

    <script>
        const lines = [
            "Initializing virus.exe...",
            "Bypassing Windows Defender...",
            "Accessing C:\\Users\\" + (window.navigator.platform.includes('Win')? 'You' : 'Documents') + "...",
            "Encrypting personal files...",
            "Uploading browser history to 198.51.100.42...",
            "Installing keylogger...",
            "Disabling mouse and keyboard in 3... 2... 1..."
        ];

        let i = 0;
        let progress = 0;

        function typeLine() {
            if (i < lines.length) {
                document.getElementById('log').innerHTML += '> ' + lines[i] + '<br>';
                i++;
                progress += 14;
                document.getElementById('bar').style.width = progress + '%';
                setTimeout(typeLine, 800 + Math.random() * 400);
            } else {
                setTimeout(() => {
                    document.getElementById('log').innerHTML += '<br>> ERROR: Joke.exe not found<br>';
                    setTimeout(() => {
                        document.getElementById('final').classList.remove('hidden');
                    }, 1500);
                }, 1000);
            }
        }

        // Disable right click to sell it
        document.addEventListener('contextmenu', e => e.preventDefault());

        // Start after 1s
        setTimeout(typeLine, 1000);
    </script>
</body>
</html>
